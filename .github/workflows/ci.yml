- name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f MLProject/requirements.txt ]; then pip install -r MLProject/requirements.txt; fi
        
    - name: Lint with flake8
      run: |
        flake8 MLProject/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 MLProject/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics