name: MLOps CI Workflow

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f MLProject/requirements.txt ]; then pip install -r MLProject/requirements.txt; fi
        
    - name: Lint with flake8
      run: |
        flake8 MLProject/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 MLProject/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # --- REVISI: MENAMBAHKAN PROSES RETRAINING OTOMATIS ---
    - name: Run MLflow Project (Retraining Model)
      run: |
        cd MLProject
        mlflow run . --env-manager=local